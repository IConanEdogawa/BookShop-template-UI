<div class="popular-container">
  <h2 class="popular-title">Сегодня самые популярные</h2>
  <div class="popular-cards">
    @for (book of popularBooks; track book) {
      <app-card
        [image]="book.image"
        [title]="book.title"
        [author]="book.author"
      ></app-card>
    }
  </div>
  <a [routerLink]="'/most-popular'" class="view-all">Просмотреть все</a>

</div>
