<section class="login-page">
  <div class="login-page__backdrop"></div>

  <div class="login-page__layout">
    <aside class="login-page__promo">
      <p class="eyebrow">Book Shop</p>
      <h1>Set New Password</h1>
      <p class="subtitle">Paste your reset code and choose a strong new password.</p>
    </aside>

    <div class="auth-card">
      <h2>Reset password</h2>
      <p class="auth-card__hint">Use the verification code from your email.</p>

      <form class="auth-form" (ngSubmit)="onResetPassword()">
        <label for="code">Code</label>
        <input type="text" id="code" [(ngModel)]="code" name="code" autocomplete="one-time-code" required />

        <label for="password">New password</label>
        <div class="password-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-btn" (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <label for="confirmPassword">Confirm password</label>
        <div class="password-wrap">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-btn" (click)="toggleConfirmPassword()">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <button class="submit-btn" type="submit">Update password</button>
      </form>

      <div class="auth-card__links">
        <a routerLink="/login">Back to login</a>
      </div>
    </div>
  </div>
</section>
