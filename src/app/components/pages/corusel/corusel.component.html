<div class="carousel-container">
  @for (item of items; track item; let i = $index) {
    <div class="carousel-slide" [class.active]="i === currentIndex">
      <div class="carousel-image-container">
        <img [src]="item.image" alt="Carousel Image" class="carousel-image">
      </div>
      <div class="carousel-poster-title-container">
        <div class="carousel-title">
          <h2>{{ item.title }}</h2>
        </div>
        <div class="carousel-poster-container">
          <img [src]="item.poster" alt="Book Poster" class="carousel-poster">
        </div>
      </div>
    </div>
  }
</div>
<div class="carousel-categories">
  @for (category of categories; track category) {
    <div class="category">{{ category }}</div>
  }
</div>
