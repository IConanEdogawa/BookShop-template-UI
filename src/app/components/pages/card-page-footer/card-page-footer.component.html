
<section class="container">
  <div class="section-head">
    <p class="eyebrow">Recommendations</p>
    <h2>Similar and related books</h2>
  </div>
  <div class="cards-container">
    @for (book of books; track book.id) {
      <app-card class="card" [id]="book.id" [image]="book.image" [title]="book.title" [author]="book.author"></app-card>
    }
  </div>
</section>
