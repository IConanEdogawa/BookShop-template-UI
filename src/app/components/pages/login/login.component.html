<section class="login-page">
  <div class="login-page__backdrop"></div>

  <div class="login-page__layout">
    <aside class="login-page__promo">
      <p class="eyebrow">Book Shop</p>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to continue reading, tracking favorites, and discovering your next bestseller.</p>
    </aside>

    <div class="auth-card">
      <h2>Log in</h2>
      <p class="auth-card__hint">Use your email and password to access your account.</p>

      <form class="auth-form" (ngSubmit)="onLogin()">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
        />

        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-btn" (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <button class="submit-btn" type="submit">Sign in</button>
      </form>

      <div class="auth-card__links">
        <a routerLink="/forgot-password">Forgot password?</a>
        <p>Don't have an account? <a routerLink="/signup">Create one</a></p>
      </div>
    </div>
  </div>
</section>
