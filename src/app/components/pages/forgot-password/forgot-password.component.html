<section class="login-page">
  <div class="login-page__backdrop"></div>

  <div class="login-page__layout">
    <aside class="login-page__promo">
      <p class="eyebrow">Book Shop</p>
      <h1>Forgot Password?</h1>
      <p class="subtitle">Enter your email and we will send a code to reset your password.</p>
    </aside>

    <div class="auth-card">
      <h2>Recover account</h2>
      <p class="auth-card__hint">We will redirect you to reset page after submit.</p>

      <form class="auth-form" (ngSubmit)="onSubmitEmail()">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" autocomplete="email" required />

        <button class="submit-btn" type="submit">Send reset code</button>
      </form>

      <div class="auth-card__links">
        <a routerLink="/login">Back to login</a>
        <p>No account yet? <a routerLink="/signup">Create one</a></p>
      </div>
    </div>
  </div>
</section>
