<app-navbar></app-navbar>

<main class="popular-books">
  <header class="page-head">
    <p class="eyebrow">Book Rankings</p>
    <h1 class="title">Popular Books</h1>
    <p class="subtitle">Browse top books by month, week, and day.</p>
  </header>

  <mat-tab-group class="mat-container">
    <mat-tab label="In Month">
      <div class="cards-container">
        @for (book of booksMonth; track book.id) {
          <app-card
            [id]="book.id"
            [image]="book.image"
            [title]="book.title"
            [author]="book.author">
          </app-card>
        }
      </div>
    </mat-tab>
    <mat-tab label="In Week">
      <div class="cards-container">
        @for (book of booksWeek; track book.id) {
          <app-card
            [id]="book.id"
            [image]="book.image"
            [title]="book.title"
            [author]="book.author">
          </app-card>
        }
      </div>
    </mat-tab>
    <mat-tab label="In Day">
      <div class="cards-container">
        @for (book of booksDay; track book.id) {
          <app-card
            [id]="book.id"
            [image]="book.image"
            [title]="book.title"
            [author]="book.author">
          </app-card>
        }
      </div>
    </mat-tab>
  </mat-tab-group>
</main>

<app-footer></app-footer>
