<app-navbar></app-navbar>

<div class="popular-books">
  <h1 class="title">Popular Books</h1>

  <mat-tab-group class="mat-container">
    <mat-tab label="In Month">
      <div class="cards-container">
        @for (book of booksMonth; track book) {
          <app-card
            [image]="book.image"
            [title]="book.title"
            [author]="book.author">
          </app-card>
        }
      </div>
    </mat-tab>
    <mat-tab label="In Week">
      <div class="cards-container">
        @for (book of booksWeek; track book) {
          <app-card
            [image]="book.image"
            [title]="book.title"
            [author]="book.author">
          </app-card>
        }
      </div>
    </mat-tab>
    <mat-tab label="In Day">
      <div class="cards-container">
        @for (book of booksDay; track book) {
          <app-card
            [image]="book.image"
            [title]="book.title"
            [author]="book.author">
          </app-card>
        }
      </div>
    </mat-tab>
  </mat-tab-group>
</div>

<app-footer></app-footer>
